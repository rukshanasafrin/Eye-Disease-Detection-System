<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>👁️ Eye Disease Detection Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            font-size: 40px;
            padding: 40px 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .result-container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            text-align: center;
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            0% { transform: translateY(50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        h3 {
            font-size: 26px;
            margin-bottom: 20px;
        }

        .highlight {
            color: #00ffcc;
            font-weight: bold;
            font-size: 28px;
        }

        .image-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 60px;
            margin-top: 40px;
        }

        .image-block {
            text-align: center;
            transition: transform 0.3s ease;
        }

        .image-block:hover {
            transform: scale(1.05);
        }

        .image-block h4 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #ffd700;
        }

        .img-preview {
            max-width: 420px;
            width: 90%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.3s;
            animation: imageFadeIn 1.2s ease-in-out;
        }

        @keyframes imageFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .img-preview:hover {
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.2);
        }

        .back-button {
            margin-top: 50px;
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            border: none;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.4s ease, transform 0.3s;
        }

        .back-button:hover {
            background: linear-gradient(to right, #0072ff, #00c6ff);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .image-grid {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div class="header">👁️ Eye Disease Detection Result</div>

    <div class="result-container">
        <h3>🩺 Predicted Class: <span class="highlight">{{ result }}</span></h3>

        <div class="image-grid">
            <div class="image-block">
                <h4>Preprocessed Image</h4>
                <img src="{{ preprocess }}" alt="Preprocessed Image" class="img-preview">
            </div>
            <div class="image-block">
                <h4>Grad-CAM Visualization</h4>
                <img src="{{ heatmap }}" alt="Grad-CAM Heatmap" class="img-preview">
            </div>
        </div>

        <a href="/" class="back-button">🔁 Try Another Image</a>
    </div>

</body>
</html>
