<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eye Disease Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .header {
            font-size: 36px;
            margin-bottom: 40px;
            font-weight: bold;
            animation: fadeInDown 1s ease;
        }

        .file-upload {
            margin-bottom: 30px;
        }

        input[type="file"] {
            padding: 10px;
            border-radius: 5px;
        }

        #file-name {
            display: block;
            margin-top: 10px;
            font-style: italic;
        }

        #preview {
            margin-top: 20px;
            max-width: 300px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            display: none;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
        }

        h3, h4 {
            margin-top: 40px;
            font-weight: 500;
        }

        .result-images {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .result-images img {
            max-width: 300px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">👁️ Eye Disease Detection</div>

    <form action="/predict" method="POST" enctype="multipart/form-data">
        <div class="file-upload">
            <label for="file">📂 Choose an eye image:</label><br>
            <input type="file" name="file" id="file" required accept="image/*" onchange="previewImage()">
            <span id="file-name">No file chosen</span>
            <img id="preview" alt="Image Preview">
        </div>
        <button type="submit">🚀 Upload & Predict</button>
    </form>

    {% if preds %}
        <h3>Prediction: <span style="color:#00ffcc">{{ preds }}</span></h3>
        <div class="result-images">
            <div>
                <h4>🧪 Preprocessed Image</h4>
                <img src="{{ preprocess }}" alt="Preprocessed Image">
            </div>
            <div>
                <h4>🔥 Grad-CAM Heatmap</h4>
                <img src="{{ heatmap }}" alt="Grad-CAM Heatmap">
            </div>
        </div>
    {% endif %}

    <script>
        function previewImage() {
            const input = document.getElementById('file');
            const fileName = document.getElementById('file-name');
            const preview = document.getElementById('preview');

            if (input.files && input.files[0]) {
                fileName.textContent = input.files[0].name;
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                fileName.textContent = "No file chosen";
                preview.style.display = 'none';
            }
        }
    </script>
</body>
</html>
